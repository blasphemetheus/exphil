<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coach pane</title>
    <!-- One slippi-viewer per document: its replay store is a module singleton,
         so every pane on the coach page is its own iframe of this file.
         Driven by postMessage: {load: url} | {seek: i} | {pause: true} | {clear: true} -->
    <script type="text/javascript" src="/tools/viewer/slippi-viewer/dist/index.js"></script>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
      html, body { height: 100%; }
      body { margin: 0; background: #f7f7f4; color: #20211f; display: flex; flex-direction: column; }
      .label { font-size: 12px; padding: 3px 8px; color: #4b4d47; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid #e3e4de; }
      .label.error { color: #9f1d1d; }
      .pane { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      slippi-viewer { display: block; aspect-ratio: 730 / 600; width: 100%; max-height: 100%; }
    </style>
  </head>
  <body>
    <div id="label" class="label">not loaded</div>
    <div class="pane">
      <slippi-viewer zips-base-url="/tools/viewer/slippi-viewer/public"></slippi-viewer>
    </div>
    <script type="module">
      import { mslTraceToReplayData } from "/tools/viewer/msltrace1.js";

      const viewer = document.querySelector("slippi-viewer");
      const label = document.querySelector("#label");
      let loaded = null;   // url of the trace currently shown
      let pendingSeek = null;

      function setLabel(text, isError = false) {
        label.textContent = text;
        label.className = isError ? "label error" : "label";
      }

      async function load(url, text) {
        if (loaded === url) { setLabel(text || label.textContent); return; }
        setLabel(`loading ${url.split("/").pop()}…`);
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const trace = await res.json();
          const data = mslTraceToReplayData(trace);
          viewer.setReplayData(data);
          loaded = url;
          setLabel(text || trace.label || `${data.frames.length} frames`);
          if (pendingSeek !== null) { viewer.setFrame(pendingSeek); pendingSeek = null; }
          parent.postMessage({ paneLoaded: url, frames: data.frames.length, id: paneId }, "*");
        } catch (error) {
          console.error(error);
          loaded = null;
          setLabel(`failed: ${error.message}`, true);
        }
      }

      const params = new URLSearchParams(location.search);
      const paneId = params.get("id") || "";

      window.addEventListener("message", (event) => {
        const msg = event.data || {};
        if (msg.load) load(msg.load, msg.label);
        if (typeof msg.seek === "number") {
          if (loaded) { viewer.pausePlayback(); viewer.setFrame(msg.seek); }
          else pendingSeek = msg.seek;
        }
        if (msg.restart) { if (loaded) viewer.setFrame(0); else pendingSeek = 0; }   // no pause: the viewer autoplays on load
        if (msg.pause) viewer.pausePlayback();
        if (msg.clear) { viewer.clear(); loaded = null; setLabel("not loaded"); }
      });

      // Report playback position: the element has no frame getter, so read the
      // viewer's own seek slider (shadow DOM) at ~15 Hz and post on change.
      let lastFrame = null;
      setInterval(() => {
        const bar = viewer.shadowRoot && viewer.shadowRoot.querySelector('input[type="range"]');
        if (!bar || !loaded) return;
        const f = bar.valueAsNumber;
        if (Number.isFinite(f) && f !== lastFrame) {
          lastFrame = f;
          parent.postMessage({ frame: f, id: paneId }, "*");
        }
      }, 66);

      if (params.get("trace")) load(params.get("trace"), params.get("label") || undefined);
      parent.postMessage({ paneReady: true, id: paneId }, "*");
    </script>
  </body>
</html>
