<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set review</title>
    <!-- Set review (2026-10-24, v1 after Bradley's notes): one of his ranked sets, reviewed the way
         a player reviews it. Open as /review/?run=/runs/<dir> (scripts/set_review_export.exs).
         Left: the games and the MOMENTS (stock losses, SDs, combos, edgeguards, recoveries,
         missed techs, neutral openings) — ground truth from the replay, filterable by type.
         Middle: the replay on the real stage (coach pane); GHOSTS toggle = reload the trace
         variant whose ports 3/4 are both players 15 frames ago, drawn by the viewer itself.
         Below: both controllers frame by frame (all 12 buttons) + a 90-frame input strip.
         Developer toggle: the model's read (agreement rows), hidden by default. -->
    <style>
      :root { --bg: #f6f5f1; --fg: #1d1c1a; --muted: #6b675e; --line: #d8d4ca; --card: #fff; --accent: #8a4b1f; --me: #c0392b; --opp: #2d6cdf; --sel: #fff2c2; --bad: #a52c22; --good: #1f6f43; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; }
      aside { overflow: auto; padding: 10px; border-right: 1px solid var(--line); background: #efece4; }
      h1 { font-size: 16px; margin: 0; } .sub { font-size: 11.5px; color: var(--muted); margin: 2px 0 10px; }
      .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
      .tab { flex: 1; padding: 6px 4px; text-align: center; border: 1px solid var(--line); border-radius: 4px; background: var(--card); cursor: pointer; font-size: 12px; }
      .tab.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .tab b { display: block; font-size: 13px; } .tab .w { color: var(--good); } .tab .l { color: var(--bad); }
      .filters { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; user-select: none; }
      .chip.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .chip small { color: var(--muted); }
      .moment { padding: 6px 8px; border-left: 3px solid transparent; border-radius: 4px; cursor: pointer; margin-bottom: 3px; background: var(--card); }
      .moment:hover { background: var(--sel); } .moment.sel { border-left-color: var(--accent); background: var(--sel); }
      .moment .t { font: 11px ui-monospace, monospace; color: var(--muted); }
      .moment .what { font-size: 12.5px; } .moment.me .what b { color: var(--me); } .moment.opp .what b { color: var(--opp); }
      .moment .how { font-size: 11px; color: var(--muted); }
      .moment .ponr { font-size: 11.5px; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
      .moment .tag { float: right; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; padding: 8px; gap: 6px; }
      .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .head h2 { font-size: 14px; margin: 0; font-weight: 600; }
      .muted { color: var(--muted); font-size: 12px; }
      iframe { width: 100%; height: 100%; border: 1px solid var(--line); background: #000; }
      button { font: inherit; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); background: var(--card); border-radius: 4px; cursor: pointer; } button:hover { background: var(--sel); }
      label.tog { font-size: 12px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
      kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: #fff; }
      .bottom { display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 6px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; }
      .card h3 { font-size: 11px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      canvas { display: block; width: 100%; }
      .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .pad h4 { margin: 0 0 2px; font-size: 12px; } .pad.me h4 { color: var(--me); } .pad.opp h4 { color: var(--opp); }
      .pad .state { font-size: 11px; color: var(--muted); min-height: 2.6em; }
      .ago { font-size: 11px; color: var(--muted); margin-top: 4px; border-top: 1px solid var(--line); padding-top: 4px; }
      .strip canvas { cursor: crosshair; }
    </style>
  </head>
  <body>
    <aside>
      <h1 id="title">Set review</h1>
      <div class="sub" id="sub">loading…</div>
      <div class="tabs" id="tabs"></div>
      <div class="filters" id="filters"></div>
      <div id="moments"></div>
    </aside>
    <main>
      <div class="head">
        <h2 id="gtitle">pick a game</h2><span class="muted" id="gsub"></span>
        <span style="margin-left:auto"></span>
        <label class="tog"><input type="checkbox" id="ghosts"> ghosts: both players 15 frames ago (ports 3 and 4 colours)</label>
        <button id="prevm">◀ moment</button><button id="nextm">moment ▶</button>
        <span class="muted"><kbd>space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 1 frame · <kbd>shift</kbd> 10 · <kbd>,</kbd><kbd>.</kbd> 15</span>
        <label class="tog muted"><input type="checkbox" id="dev"> developer: the model's read</label>
      </div>
      <iframe id="pane" src="/coach/pane.html?id=main" title="replay"></iframe>
      <div class="bottom">
        <div class="card strip"><h3>inputs, frame by frame — last 90 frames · <span id="stripwho">you</span> <button id="swap" style="padding:0 6px;font-size:11px">show opponent</button> <span class="muted" id="fnum"></span> <span class="muted">· red = the frame a button went down · dashed line = 15 frames ago</span></h3><canvas id="strip" height="150"></canvas><canvas id="devlane" height="70" hidden></canvas></div>
        <div class="card"><h3>controllers this frame</h3>
          <div class="pads">
            <div class="pad me"><h4 id="mename">you</h4><canvas id="padme" height="110"></canvas><div class="state" id="stme"></div></div>
            <div class="pad opp"><h4 id="oppname">opponent</h4><canvas id="padopp" height="110"></canvas><div class="state" id="stopp"></div></div>
          </div>
          <div class="ago" id="ago"></div>
        </div>
      </div>
    </main>
    <script type="module">
      const $ = (s) => document.querySelector(s);
      const params = new URLSearchParams(location.search);
      const base = params.get("run") || "/runs/1024_set_review";
      const pane = $("#pane");
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const NAMES = await fetch("/review/action_names.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
      const aname = (id) => NAMES[id] || `action ${id}`;
      const pretty = (n) => String(n || "").toLowerCase().replace(/_/g, " ");
      const mmss = (f) => { const s = Math.max(0, Math.floor(f / 60)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
      const BTN = ["A", "B", "X", "Y", "Z", "L", "R", "St", "D↑", "D↓", "D←", "D→"];
      const BCOL = ["#2e8b57", "#c0392b", "#777", "#777", "#6a3fb5", "#444", "#444", "#999", "#8a4b1f", "#8a4b1f", "#8a4b1f", "#8a4b1f"];
      const TYPES = { stock_loss: "stocks", sd: "SDs", combo: "combos", edgeguard: "edgeguards", recovery: "recoveries", missed_tech: "missed techs", opening: "openings", ledge_trap: "ledge traps", juggle: "juggles", tech_chase: "tech chases", shield_pressure: "shield pressure" };
      // default view = the important ones; the rest switch on by chip
      const on = new Set(["stock_loss", "sd", "combo", "edgeguard", "missed_tech"]);
      let manifest, game, gi = -1, mi = -1, frame = 0, playing = false, stripOpp = false, rows = null, ghosts = false, shown = [];

      manifest = await (await fetch(`${base}/manifest.json`)).json();
      $("#title").textContent = manifest.label || "Set review";
      $("#sub").textContent = `${manifest.me} · set ${manifest.score} · ${manifest.games.length} games`;
      $("#tabs").innerHTML = manifest.games.map((g, k) => `<div class="tab" data-k="${k}"><b>G${k + 1} <span class="${g.winner === "me" ? "w" : "l"}">${g.winner === "me" ? "W" : "L"}</span></b>${g.final.me}–${g.final.opp} · ${stageName(g.stage)}</div>`).join("");
      document.querySelectorAll(".tab").forEach((el) => (el.onclick = () => pickGame(Number(el.dataset.k))));
      function stageName(s) { return { 2: "FoD", 3: "PS", 8: "YS", 28: "DL", 31: "BF", 32: "FD" }[s] || `stage ${s}`; }

      // which moments matter by default: edgeguards only when a stock fell or ≥ 15 % was taken; openings only with ≥ 25 % follow-up
      const important = (m) => m.type === "edgeguard" ? (m.outcome === "stock" || (m.damage || 0) >= 15) : m.type === "opening" ? (m.follow_up_damage || 0) >= 25 : m.type === "recovery" ? m.outcome === "stock"
        : ["ledge_trap", "juggle", "tech_chase", "shield_pressure"].includes(m.type) ? (m.outcome === "stock" || (m.damage || 0) >= 20) : true;

      async function pickGame(k) {
        gi = k; const g = manifest.games[k];
        document.querySelectorAll(".tab").forEach((el) => el.classList.toggle("sel", Number(el.dataset.k) === k));
        game = await (await fetch(`${base}/${g.game}`)).json();
        rows = null; if ($("#dev").checked) loadRows();
        $("#mename").textContent = `${game.me.name} (${game.me.character})`; $("#oppname").textContent = `${game.opp.name} (${game.opp.character})`;
        $("#gtitle").textContent = `Game ${k + 1} · ${game.me.character} vs ${game.opp.character} on ${stageName(game.stage)} · ${game.winner === "me" ? "won" : "lost"} ${game.final.me}–${game.final.opp}`;
        $("#gsub").textContent = `${mmss(game.frames)} of play`;
        renderFilters(); renderMoments();
        loadTrace(0); frame = 0; mi = -1; playing = false; drawAll();
        history.replaceState(null, "", `?run=${encodeURIComponent(base)}&g=${k}`);
      }
      function loadTrace(at) {
        const g = manifest.games[gi];
        pane.contentWindow.postMessage({ load: `${base}/${ghosts ? g.ghost_trace : g.trace}`, label: `[G${gi + 1}] ${game.me.name} (red) vs ${game.opp.name}${ghosts ? " · ghosts = 15 f ago" : ""}`, seek: at }, "*");
        pane.contentWindow.postMessage({ marks: deathMarks() }, "*");
      }
      const deathMarks = () => game.moments.filter((m) => m.type === "stock_loss" || m.type === "sd").map((m) => ({ i: m.frame - game.first_frame, label: m.who === "me" ? "you died" : "they died", color: m.who === "me" ? "#c0392b" : "#1f6f43" }));
      $("#ghosts").onchange = () => { ghosts = $("#ghosts").checked; if (game) { loadTrace(frame); playing = false; } };

      function renderFilters() {
        const counts = {}; game.moments.forEach((m) => { counts[m.type] = (counts[m.type] || 0) + (important(m) ? 1 : 0); });
        $("#filters").innerHTML = Object.entries(TYPES).map(([t, lab]) => `<span class="chip ${on.has(t) ? "on" : ""}" data-t="${t}">${lab} <small>${counts[t] || 0}</small></span>`).join("") + `<span class="chip ${on.has("all") ? "on" : ""}" data-t="all">everything <small>${game.moments.length}</small></span>`;
        document.querySelectorAll(".chip").forEach((el) => (el.onclick = () => { const t = el.dataset.t; on.has(t) ? on.delete(t) : on.add(t); renderFilters(); renderMoments(); }));
      }
      function describe(m) {
        const you = m.who === "me", oc = game.opp.character, yours = you ? "your" : `${oc}'s`;
        const attackish = (n) => n && !/^(DASHING|JUMPING|FALLING|STANDING|WAIT|LANDING|DAMAGE|RUN|TURN|WALK)/.test(n);
        switch (m.type) {
          case "stock_loss": { const victim = you ? "<b>You</b> lost a stock" : `<b>${esc(oc)}</b> lost a stock`;
            const by = attackish(m.killed_by) ? `to ${you ? oc + "'s" : "your"} ${pretty(m.killed_by)}` : `(last hit ${(m.frame - m.last_hit_frame) / 60 | 0} s earlier while ${you ? oc : "you"} ${pretty(m.killed_by)} — a laser or an earlier hit)`;
            const combo = m.combo_hits > 1 ? ` · after a ${m.combo_hits}-hit ${m.combo_damage}% string: ${m.combo_moves.map(pretty).join(", ")}` : "";
            return { what: `${victim} at ${Math.round(m.percent)}%`, how: `${by}${combo} · ${m.stocks_left} left`, ponr: ponrText(m) }; }
          case "sd": return { what: you ? `<b>You</b> self-destructed at ${Math.round(m.percent)}%` : `<b>${esc(oc)}</b> self-destructed at ${Math.round(m.percent)}%`, how: `no hit in the last 4 s${m.combo_moves.length ? ` · last touch: ${m.combo_moves.map(pretty).join(", ")}` : ""} · ${m.stocks_left} left`, ponr: ponrText(m) };
          case "combo": return { what: `<b>${you ? "Your" : esc(oc) + "'s"}</b> combo: ${m.hits} hits, ${m.damage}%`, how: `${Math.round(m.from)}% → ${Math.round(m.to)}% · ${m.moves.map(pretty).join(", ")}` };
          case "edgeguard": return { what: `<b>${you ? "You" : esc(oc)}</b> edgeguarded ${you ? oc : "you"}: ${m.outcome === "stock" ? "took the stock" : "they got back"}`, how: `${(m.frames / 60).toFixed(1)} s offstage${m.damage ? ` · ${m.damage}% dealt` : ""}` };
          case "recovery": return { what: `<b>You</b> recovered from low: ${m.outcome === "stock" ? "did not make it" : "made it back"}`, how: `${(m.frames / 60).toFixed(1)} s below the ledge` };
          case "missed_tech": return { what: `<b>${you ? "You" : esc(oc)}</b> missed a tech at ${Math.round(m.percent)}%`, how: `${((m.end_frame - m.frame) / 60).toFixed(1)} s on the ground` };
          case "opening": return { what: `<b>${you ? "You" : esc(oc)}</b> won neutral with ${pretty(m.move)}`, how: `${m.damage}% on the hit, ${m.follow_up_damage}% in the next 4 s` };
          case "ledge_trap": case "juggle": case "tech_chase": case "shield_pressure": {
            const verb = { ledge_trap: "trapped at the ledge", juggle: "juggled", tech_chase: "tech-chased", shield_pressure: "pressured the shield of" }[m.type];
            return { what: `<b>${you ? "You" : esc(oc)}</b> ${verb} ${you ? oc : "you"}: ${m.outcome === "stock" ? "took the stock" : (m.damage >= 20 ? `${m.damage}% taken` : "nothing came of it")}`, how: `${(m.frames / 60).toFixed(1)} s · ${m.damage}% dealt` }; }
        }
        return { what: m.type, how: "" };
      }
      // the point of no return (ExPhil.Melee.Checkmate over the offstage frames; Fox only)
      const means = (r) => r.means.length ? r.means.map((x) => ({ jump: "double jump", up_b: "up-B", side_b: "side-B", air_dodge: "air dodge", wall_jump: "wall jump" }[x] || x)).join(" + ") : "drift";
      function ponrText(m) {
        const q = m.ponr; if (!q) return m.who === "me" ? "" : "(point of no return: Fox only for now)";
        const routes = q.routes_at_choice ? [...new Map(q.routes_at_choice.map((r) => [means(r) + " → " + r.to, r])).values()] : [];
        const list = routes.slice(0, 3).map((r) => `${means(r)} → ${r.to}`).join("; ") + (routes.length > 3 ? `; +${routes.length - 3} more` : "");
        const since = (f) => `${mmss(f - game.first_frame)} (f${f})`;
        switch (q.kind) {
          case "direct_ko": return `<b>Dead from the hit.</b> No recovery existed once you left the stage at ${since(q.offstage_from)}; the only questions are the DI and what came before.`;
          case "failed_recovery": return `<b>Recoverable until ${since(q.last_choice_frame)}</b> — ${q.routes_at_choice?.length ?? 0} ways back: ${list}. Point of no return ${q.ponr_frame - q.last_choice_frame} frames later; what you did: ${q.actions_after_choice.map(pretty).join(" → ")}.`;
          case "unforced": return `<b>Never checkmated.</b> A route existed on every frame down (${list}); it was not used. What you did: ${q.actions_after_choice.map(pretty).join(" → ")}.`;
          case "hit_during_recovery": return `<b>Had ${q.routes_at_choice?.length ?? 0} ways back at ${since(q.last_choice_frame)}</b> (${list}), then got hit again and died in that hitstun${q.wall_bounce ? " — <b>and bounced off the wall without a wall tech</b>" : ""}.`;
          case "sd": return `<b>Self-destruct with routes open</b> at ${since(q.last_choice_frame)}: ${list}.`;
        }
        return "";
      }
      function renderMoments() {
        shown = game.moments.map((m, k) => ({ m, k })).filter(({ m }) => on.has("all") || (on.has(m.type) && important(m)));
        $("#moments").innerHTML = shown.map(({ m, k }) => { const d = describe(m); return `<div class="moment ${m.who}" data-k="${k}"><span class="tag">${TYPES[m.type] || m.type}</span><div class="t">${mmss(m.frame - game.first_frame)}</div><div class="what">${d.what}</div><div class="how">${d.how}</div>${d.ponr ? `<div class="ponr">${d.ponr}</div>` : ""}</div>`; }).join("") || '<div class="muted">nothing of this kind in this game</div>';
        document.querySelectorAll(".moment").forEach((el) => { el.onclick = () => pickMoment(Number(el.dataset.k)); el.classList.toggle("sel", Number(el.dataset.k) === mi); });
      }
      function pickMoment(k) {
        mi = k; const m = game.moments[k];
        document.querySelectorAll(".moment").forEach((el) => el.classList.toggle("sel", Number(el.dataset.k) === k));
        // open paused where it matters: 2 s before a killing hit, else 1 s into the clip
        const q = m.ponr;
        const at = (q && q.last_choice_frame ? q.last_choice_frame - 45 : m.type === "stock_loss" && m.last_hit_frame ? m.last_hit_frame - 120 : m.clip[0] + 60) - game.first_frame;
        seek(Math.max(0, at)); playing = false;
        const marks = deathMarks();
        if (q && q.last_choice_frame) marks.push({ i: q.last_choice_frame - game.first_frame, label: "last choice", color: "#b8860b" });
        if (q && q.ponr_frame) marks.push({ i: q.ponr_frame - game.first_frame, label: q.kind === "direct_ko" ? "dead from the hit" : "point of no return", color: "#c0392b" });
        pane.contentWindow.postMessage({ marks }, "*");
        document.querySelector(`.moment[data-k="${k}"]`)?.scrollIntoView({ block: "nearest" });
      }
      const step = (dir) => { if (!shown.length) return; const idx = shown.findIndex((s) => s.k === mi); const nxt = shown[Math.max(0, Math.min(shown.length - 1, (idx < 0 ? (dir > 0 ? -1 : shown.length) : idx) + dir))]; if (nxt) pickMoment(nxt.k); };
      $("#nextm").onclick = () => step(1); $("#prevm").onclick = () => step(-1);

      function seek(i) { if (!game) return; frame = Math.max(0, Math.min(game.frames - 1, i)); pane.contentWindow.postMessage({ seek: frame }, "*"); playing = false; drawAll(); }
      function play() { pane.contentWindow.postMessage({ goto: frame }, "*"); playing = true; }
      function key(k, shift) {
        if (k === " " || k === "Spacebar") { if (playing) { pane.contentWindow.postMessage({ pause: true }, "*"); playing = false; } else play(); }
        else if (k === "ArrowLeft") seek(frame - (shift ? 10 : 1)); else if (k === "ArrowRight") seek(frame + (shift ? 10 : 1));
        else if (k === ",") seek(frame - 15); else if (k === ".") seek(frame + 15);
      }
      window.addEventListener("keydown", (e) => { if (e.target instanceof Element && e.target.matches("input,textarea")) return; if ([" ", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault(); key(e.key, e.shiftKey); });
      window.addEventListener("message", (ev) => { const m = ev.data || {}; if (m.id && m.id !== "main") return;
        if (typeof m.frame === "number" && game && m.frame !== frame) { frame = m.frame; drawAll(); }
        if (m.paneKey) key(m.paneKey, false); });

      // ---- drawing -----------------------------------------------------------------------------
      function setup(c) { const r = c.getBoundingClientRect(); const dpr = devicePixelRatio || 1; c.width = Math.round(r.width * dpr); const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w: r.width, h: c.height }; }
      const P = (who, i) => game.p[who][i]; const C = (who, i) => game.c[who][i];

      function drawPad(c, ctrl) {
        const { ctx, w, h } = setup(c); ctx.clearRect(0, 0, w, h);
        if (!ctrl) { ctx.fillStyle = "#9a958b"; ctx.fillText("no input", 4, 12); return; }
        const [mask, mx, my, cx, cy, l, r] = ctrl; const cyc = 48;
        const stick = (x0, vx, vy, rad, col) => { ctx.strokeStyle = "#cfcac0"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x0, cyc, rad, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x0 - rad, cyc); ctx.lineTo(x0 + rad, cyc); ctx.moveTo(x0, cyc - rad); ctx.lineTo(x0, cyc + rad); ctx.stroke();
          const px = x0 + (vx - 0.5) * 2 * rad, py = cyc - (vy - 0.5) * 2 * rad; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, cyc); ctx.lineTo(px, py); ctx.stroke(); ctx.lineWidth = 1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill(); };
        stick(32, mx, my, 27, "#1d1c1a"); stick(86, cx, cy, 17, "#b8860b");
        ctx.font = "9px system-ui"; ctx.fillStyle = "#9a958b"; ctx.fillText("main", 21, 96); ctx.fillText("c", 83, 96);
        const trig = (x, v, lab) => { ctx.fillStyle = "#e8e5dd"; ctx.fillRect(x, 10, 9, 74); ctx.fillStyle = "#5a5a5a"; ctx.fillRect(x, 10 + 74 * (1 - v), 9, 74 * v); ctx.fillStyle = "#9a958b"; ctx.fillText(lab, x + 1, 96); };
        trig(112, l, "L"); trig(125, r, "R");
        // 12 buttons in a 4 x 3 grid
        BTN.forEach((b, i) => { const onb = mask & (1 << i); const bx = 146 + (i % 4) * 24, by = 6 + Math.floor(i / 4) * 30;
          ctx.beginPath(); ctx.arc(bx + 10, by + 10, 10, 0, Math.PI * 2); ctx.fillStyle = onb ? BCOL[i] : "#eeebe4"; ctx.fill(); ctx.strokeStyle = onb ? BCOL[i] : "#cfcac0"; ctx.stroke();
          ctx.fillStyle = onb ? "#fff" : "#9a958b"; ctx.font = "bold 9px system-ui"; ctx.textAlign = "center"; ctx.fillText(b, bx + 10, by + 13); ctx.textAlign = "left"; });
      }
      function drawPads() {
        drawPad($("#padme"), C("me", frame)); drawPad($("#padopp"), C("opp", frame));
        const st = (p) => p ? `${pretty(aname(p[3]))} · frame ${p[4]} of the move${p[7] ? "" : " · airborne"} · ${Math.round(p[5])}% · ${p[6]} stocks${p[9] < 60 ? ` · shield ${Math.round(p[9])}` : ""}${p[8] > 0.5 ? ` · hitstun ${Math.round(p[8])}` : ""}${p[11] != null ? ` · jumps ${p[11]}` : ""}` : "";
        $("#stme").textContent = st(P("me", frame)); $("#stopp").textContent = st(P("opp", frame));
        const me15 = P("me", frame - 15), op15 = P("opp", frame - 15), op = P("opp", frame);
        const txt = (p) => p ? `${pretty(aname(p[3]))} f${p[4]}` : "?";
        $("#ago").innerHTML = `<b>15 frames ago</b> — you: ${txt(me15)} · ${esc(game.opp.character)}: ${txt(op15)}${op && op15 && me15 ? ` · they were ${Math.round(Math.hypot(op15[0] - me15[0], op15[1] - me15[1]))} units away, now ${Math.round(Math.hypot(op[0] - P("me", frame)[0], op[1] - P("me", frame)[1]))}` : ""}`;
      }
      // input strip: last 90 frames of one player's controller — main, c, then every button
      function drawStrip() {
        const who = stripOpp ? "opp" : "me"; $("#stripwho").textContent = stripOpp ? game.opp.character : "you"; $("#fnum").textContent = `frame ${frame} · ${mmss(frame)}`;
        const c = $("#strip"); const { ctx, w, h } = setup(c); ctx.clearRect(0, 0, w, h);
        const N = 90, from = frame - N + 1, cw = w / N; const rowsL = ["main", "c", ...BTN]; const rh = h / rowsL.length;
        ctx.font = "9px system-ui";
        rowsL.forEach((lab, k) => { ctx.fillStyle = k % 2 ? "#faf9f6" : "#fff"; ctx.fillRect(0, k * rh, w, rh); ctx.fillStyle = "#9a958b"; ctx.fillText(lab, 2, k * rh + rh - 1.5); });
        const q = mi >= 0 && game.moments[mi].ponr;
        if (q && who === "me") { const xo = (f) => (f - game.first_frame - from) * cw;
          if (q.last_choice_frame && q.ponr_frame) { ctx.fillStyle = "rgba(184,134,11,0.14)"; ctx.fillRect(xo(q.last_choice_frame), 0, xo(q.ponr_frame) - xo(q.last_choice_frame), h); }
          if (q.ponr_frame) { ctx.fillStyle = "rgba(192,57,43,0.12)"; ctx.fillRect(xo(q.ponr_frame), 0, w - xo(q.ponr_frame), h); } }
        const ang = (x, y) => { const dx = x - 0.5, dy = y - 0.5; return Math.hypot(dx, dy) < 0.14 ? null : Math.atan2(dy, dx); };
        for (let i = 0; i < N; i++) {
          const f = from + i; const ctrl = C(who, f); if (!ctrl) continue; const x0 = i * cw; const [mask, mx, my, cx, cy] = ctrl;
          const arrow = (row, a, mag, col) => { if (a == null) return; const cxp = x0 + cw / 2, cyp = row * rh + rh / 2, r = Math.min(cw, rh) * 0.45 * Math.min(1, mag * 2); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cxp, cyp); ctx.lineTo(cxp + Math.cos(a) * r, cyp - Math.sin(a) * r); ctx.stroke(); ctx.lineWidth = 1; };
          arrow(0, ang(mx, my), Math.hypot(mx - 0.5, my - 0.5), "#1d1c1a"); arrow(1, ang(cx, cy), Math.hypot(cx - 0.5, cy - 0.5), "#b8860b");
          const prev = C(who, f - 1);
          for (let b = 0; b < BTN.length; b++) if (mask & (1 << b)) { const edge = !(prev && (prev[0] & (1 << b))); ctx.fillStyle = edge ? "#c0392b" : "#555"; ctx.fillRect(x0, (b + 2) * rh + 1.5, Math.max(1, cw - 0.5), rh - 3); }
        }
        ctx.strokeStyle = "#1d1c1a"; ctx.beginPath(); ctx.moveTo(w - cw / 2, 0); ctx.lineTo(w - cw / 2, h); ctx.stroke();
        ctx.strokeStyle = "#8a4b1f"; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(w - 15.5 * cw, 0); ctx.lineTo(w - 15.5 * cw, h); ctx.stroke(); ctx.setLineDash([]);
        c.onclick = (e) => { const r = c.getBoundingClientRect(); seek(from + Math.floor(((e.clientX - r.left) / r.width) * N)); };
        if ($("#dev").checked) drawDev(from, N, cw);
      }
      $("#swap").onclick = () => { stripOpp = !stripOpp; $("#swap").textContent = stripOpp ? "show you" : "show opponent"; drawStrip(); };

      // developer layer: the model's read from the agreement rows, if exported
      async function loadRows() {
        try { const txt = await (await fetch(`${base}/rows.jsonl`)).text(); const all = txt.trim().split("\n").map((l) => JSON.parse(l)); rows = new Map(all.filter((r) => r.g === gi).map((r) => [r.frame, r])); } catch (e) { rows = new Map(); }
        drawStrip();
      }
      $("#dev").onchange = () => { $("#devlane").hidden = !$("#dev").checked; if ($("#dev").checked && !rows) loadRows(); else drawStrip(); };
      function drawDev(from, N, cw) {
        const c = $("#devlane"); const { ctx, w, h } = setup(c); ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#9a958b"; ctx.font = "9px system-ui"; ctx.fillText(rows && rows.size ? "model: P(jump) blue · P(attack) orange · P(special) green · P(trigger) grey · surprise red (−log p of your input)" : "model rows not exported for this set (eval_runs/<run>/rows.jsonl)", 2, 10);
        if (!rows) return; const FAM = { jump: "#1d5c8a", attack: "#a3501a", special: "#2f7d4a", trigger: "#5a5a5a" };
        for (let i = 0; i < N; i++) { const r = rows.get(from + i); if (!r) continue; const x0 = i * cw; let k = 0;
          for (const [f, col] of Object.entries(FAM)) { const ph = r.p[f] * (h - 14); ctx.fillStyle = col; ctx.globalAlpha = 0.6; ctx.fillRect(x0 + k * (cw / 4), h - ph, cw / 4, ph); ctx.globalAlpha = 1; k++; }
          const sh = Math.min(1, r.nll / 10) * (h - 14); ctx.strokeStyle = "#c7362b"; ctx.beginPath(); ctx.moveTo(x0 + cw / 2, h); ctx.lineTo(x0 + cw / 2, h - sh); ctx.stroke(); }
      }
      function drawAll() { if (!game) return; drawPads(); drawStrip(); }
      window.addEventListener("resize", drawAll);
      const g0 = params.get("g"); pickGame(g0 != null ? Number(g0) : 0);
    </script>
  </body>
</html>
